[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "1.0.0"
description = "SENTINEL — Sequential Entity Neural Topology Investigation & Nesting Evaluation for LLMs"
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = {text = "MIT"}

dependencies = [
    "accelerate>=1.1.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "seqeval>=1.2.2",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "rich>=13.5.0",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "gliner>=0.2.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
notebook = [
    "ipywidgets>=8.1.0",
    "jupyter>=1.0.0",
]
viz = [
    "plotly>=5.15.0",
    "scienceplots>=2.0.0",
]
xai = [
    "captum>=0.7.0",
    "spacy>=3.7.0",
]
all = [
    "sentinel[dev,notebook,viz,xai]",
]

[project.scripts]
sentinel = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `verify_figure_naming.py` e `validate_attributes.py` moram em tests/ com nome de
# script, e por isso o padrão `test_*.py` do pytest NÃO os coletava: rodavam só
# quando invocados por caminho, e a divergência entre `pytest tests/` e a
# ferramenta por arquivo apareceu na medida pós-corte de 02/09/2026 (197 testes
# contra 195). Guarda que não roda na coleta padrão não é guarda.
python_files = ["test_*.py", "verify_*.py", "validate_*.py"]
addopts = ["-v", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_torch: marks tests that need PyTorch installed",
    "requires_transformers: marks tests that need HuggingFace Transformers",
]

[dependency-groups]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]
